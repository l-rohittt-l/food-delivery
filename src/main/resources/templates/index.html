<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Foodies Express</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon fix -->
    <link rel="icon" href="data:,">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Foodies Express
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About Us</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
            </ul>

            <!-- 🔍 Search Bar -->
            <form class="d-flex me-3" id="searchForm">
                <input class="form-control me-2" type="search" placeholder="Search food..." id="searchInput" autocomplete="off">
            </form>

			<!-- 👤 Profile -->
			<div class="dropdown me-3">
			    <a href="#" class="btn btn-outline-light dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown">
			        <i class="bi bi-person-circle me-1"></i> Profile
			    </a>

				<ul class="dropdown-menu dropdown-menu-end">

				    <!-- ✅ Show if User is logged in as USER -->
				    <li sec:authorize="hasRole('USER')">
				        <a class="dropdown-item" href="/user/dashboard">Dashboard</a>
				    </li>
				    <li sec:authorize="hasRole('USER')">
				        <a class="dropdown-item" href="/profile">My Profile</a>
				    </li>
				    <li sec:authorize="hasRole('USER')">
				        <a class="dropdown-item" href="/user/orders">My Orders</a>
				    </li>
				    <li sec:authorize="hasRole('USER')"><hr class="dropdown-divider"></li>
				    <li sec:authorize="hasRole('USER')">
				        <a class="dropdown-item" href="/logout">Logout</a>
				    </li>

				    <!-- ✅ Show if logged in as ADMIN -->
				    <li sec:authorize="hasRole('ADMIN')">
				        <a class="dropdown-item" href="/admin/dashboard">Dashboard</a>
				    </li>
				    <li sec:authorize="hasRole('ADMIN')">
				        <a class="dropdown-item" href="/logout">Logout</a>
				    </li>

				    <!-- 🔒 When user is NOT logged in -->
				    <li sec:authorize="isAnonymous()">
				        <a class="dropdown-item" href="/login">Login</a>
				    </li>
				    <li sec:authorize="isAnonymous()">
				        <a class="dropdown-item" href="/register">Signup</a>
				    </li>
				</ul>
			</div>

            <!-- 🛒 Cart Icon -->
            <a href="/cart" class="btn btn-warning position-relative">
                <i class="bi bi-cart-fill"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      id="cartCount" style="display: none;">0</span>
            </a>
        </div>
    </div>
	
</nav>

<!-- ✅ Main Section -->
<div class="container mt-4">
    <h2 class="text-center mb-4">Available Food Items</h2>

    <!-- 🔁 Main Dynamic Content -->
    <div class="row" id="foodContainer">
        <!-- Fallback Thymeleaf rendering (optional) -->
        <div class="col-md-4 mb-4" th:each="food : ${foodList}">
            <div class="card h-100 shadow-sm border-0 rounded-4">
                <img th:src="${food.imageUrl != null ? food.imageUrl : '/images/default-food.jpg'}"
                     class="card-img-top rounded-top img-fluid"
                     alt="Food Image"
                     style="height: 200px; width: 100%; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold" th:text="${food.name}"></h5>
                    <span class="badge mb-2"
                          th:classappend="${food.category == 'Vegetarian' ? 'bg-success' : 'bg-danger'}"
                          th:text="${food.category}"></span>
                    <p class="card-text text-muted small" th:text="${food.description}"></p>
                    <h6 class="text-primary mb-3 fw-semibold" th:text="'₹' + ${food.price}"></h6>
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-2">
                        <button class="btn btn-outline-secondary btn-sm decrease-btn" th:data-id="${food.id}">−</button>
                        <input type="number" class="form-control text-center" th:value="1" min="1"
                               th:data-id="${food.id}" style="width: 60px;" readonly>
                        <button class="btn btn-outline-secondary btn-sm increase-btn" th:data-id="${food.id}">+</button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center gap-3 mt-3">
                        <button class="btn btn-warning flex-button fw-semibold rounded-3 shadow-sm addToCartBtn"
                                th:data-id="${food.id}">Add to Cart</button>
                        <a th:href="@{/cart}" class="btn btn-primary flex-button fw-semibold rounded-3 shadow-sm">Order Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
</div>

<!-- ✅ Scripts -->

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/search.js}"></script>
<script th:src="@{/js/pagination.js}"></script>

</body>
</html>
