<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Food Delivery</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Food Delivery
        </a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="text-center mb-4">Checkout</h2>

    <div class="row">
        <!-- 🛒 Order Summary -->
        <div class="col-md-7">
            <h4>Your Order</h4>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cartItems}">
                        <td th:text="${item.food.name}"></td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="'₹' + ${item.food.price}"></td>
                        <td th:text="'₹' + ${item.food.price * item.quantity}"></td>
                    </tr>
                </tbody>
            </table>
            <h5 class="text-end">Total: ₹<span th:text="${totalPrice}">0</span></h5>
        </div>

        <!-- 📝 Shipping Details -->
        <div class="col-md-5">
            <h4>Shipping Info</h4>
            <form th:action="@{/checkout}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>


			    <div class="mb-3">
			        <label for="email" class="form-label">Email</label>
			        <input type="email" class="form-control" id="email" name="email" required>
			    </div>
					
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="payment" class="form-label">Payment Method</label>
                    <select class="form-select" id="payment" name="payment">
                        <option value="COD">Cash on Delivery</option>
                        <option value="Card">Credit/Debit Card</option>
                        <option value="UPI">UPI</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Place Order</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
