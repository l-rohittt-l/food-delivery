<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation - Foodies Express</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Foodies Express
        </a>
    </div>
</nav>

<!-- ✅ Order Confirmation Content -->
<div class="container mt-5">
    <div class="text-center">
        <h2 class="text-success mb-3">Thank You for Your Order!</h2>
        <p>Your order has been placed successfully. A confirmation has been sent to your email.</p>
    </div>

    <div class="row mt-4 justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Order Details</h5>
                </div>
                <div class="card-body">
                    <p><strong>Name:</strong> <span th:text="${order.customerName}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${order.customerEmail}"></span></p>
                    <p><strong>Address:</strong> <span th:text="${order.customerAddress}"></span></p>
                    <p><strong>Order Placed:</strong> <span th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy HH:mm')}"></span></p>

                    <hr>

                    <h6 class="mb-3">Items Ordered:</h6>
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            th:each="item : ${order.orderItems}">
                            <div>
                                <strong th:text="${item.food.name}"></strong>
                                <small class="d-block text-muted">Qty: <span th:text="${item.quantity}"></span></small>
                            </div>
                            <span th:text="'₹' + ${item.food.price * item.quantity}"></span>
                        </li>
                    </ul>

                    <hr>

                    <h5 class="text-end">Total Paid: ₹<span th:text="${order.totalAmount}"></span></h5>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
