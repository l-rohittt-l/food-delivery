<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Food</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Add New Food Item</h2>

	<form th:action="@{${food.id} != null ? '/admin/foods/edit/' + ${food.id} : '/admin/foods/add'}"
	      th:object="${food}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="name" class="form-label">Food Name</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>

        <div class="col-md-6">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" th:field="*{category}" required>
                <option value="">-- Select --</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="Non Vegetarian">Non Vegetarian</option>
            </select>
        </div>

        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="2" required></textarea>
        </div>

        <div class="col-md-6">
            <label for="price" class="form-label">Price (₹)</label>
            <input type="number" class="form-control" id="price" th:field="*{price}" step="0.01" min="1" required>
        </div>

        <div class="col-md-6">
            <label for="imageUrl" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="imageUrl" th:field="*{imageUrl}">
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success">Finish</button>
            <a href="/admin/foods" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
