<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Users - Admin</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/admin/dashboard">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Admin Panel
        </a>
        <a href="/logout" class="btn btn-outline-light">Logout</a>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Registered Users</h2>

    <!-- 🔍 Search Bar -->
    <form class="input-group mb-4" method="get" th:action="@{/admin/users}">
        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search by name or email">
        <button type="submit" class="btn btn-outline-secondary">Search</button>
    </form>

    <!-- 📋 Table -->
    <div th:if="${userPage.totalElements == 0}" class="alert alert-info text-center">No users found.</div>

    <div class="table-responsive" th:if="${userPage.totalElements > 0}">
        <table class="table table-bordered table-hover text-center align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${userPage.content}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.name}">John Doe</td>
                <td th:text="${user.email}">john@example.com</td>
                <td th:text="${user.phone}">1234567890</td>
                <td th:text="${user.address}">123 Street</td>
                <td>
                    <span class="badge"
                          th:classappend="${user.role == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${user.role}">USER</span>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- ⬅️ Pagination -->
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, userPage.totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link"
                       th:href="@{/admin/users(page=${i}, keyword=${keyword})}"
                       th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${currentPage == userPage.totalPages - 1} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
