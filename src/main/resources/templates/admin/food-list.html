<div class="container mt-5">
    <h2 class="mb-4">Manage Food Items</h2>

    <!-- 🔍 Search Form -->
    <form method="get" action="/admin/foods" class="mb-3 d-flex justify-content-between align-items-center">
        <input type="text" name="search" class="form-control w-25" placeholder="Search by name..." th:value="${search}">
        <button type="submit" class="btn btn-outline-primary ms-2">Search</button>
    </form>

    <!-- 🔘 Add New Button -->
    <div class="mb-3 text-end">
        <a href="/admin/foods/add" class="btn btn-success">+ Add New Food</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- 📋 Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Price (₹)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="food : ${foods}">
                    <td th:text="${food.id}"></td>
                    <td>
                        <img th:src="${food.imageUrl != null ? food.imageUrl : '/images/default-food.jpg'}"
                             alt="Food Image" style="height: 60px; width: 60px; object-fit: cover;">
                    </td>
                    <td th:text="${food.name}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${food.category == 'Vegetarian'} ? 'bg-success' : 'bg-danger'"
                              th:text="${food.category}"></span>
                    </td>
                    <td th:text="${food.description}"></td>
                    <td th:text="${food.price}"></td>
                    <td>
                        <a th:href="@{'/admin/foods/edit/' + ${food.id}}" class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{'/admin/foods/delete/' + ${food.id}}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this item?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ⬅️ Pagination -->
    <nav th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/foods(page=${currentPage - 1}, search=${search})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/admin/foods(page=${i}, search=${search})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/foods(page=${currentPage + 1}, search=${search})}">Next</a>
            </li>
        </ul>
    </nav>
</div>


<!-- ✅ Bootstrap JS -->
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
