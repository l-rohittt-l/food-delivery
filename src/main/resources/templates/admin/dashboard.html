<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Foodies Express</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Foodies Express - Admin
        </a>
        <div class="ms-auto">
            <a href="/logout" class="btn btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<!-- ✅ Page Content -->
<div class="container mt-5">
    <h2 class="mb-4">Welcome, Admin!</h2>

    <div class="row g-4">

        <!-- 🥗 Manage Food -->
        <div class="col-md-4">
            <div class="card text-white bg-success h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">Manage Food Items</h5>
                    <p class="card-text">Add, edit, or delete food items shown on the homepage.</p>
                    <a href="/admin/foods" class="btn btn-light mt-auto">Go to Food Management</a>
                </div>
            </div>
        </div>

        <!-- 📦 View Orders -->
        <div class="col-md-4">
            <div class="card text-white bg-primary h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">View All Orders</h5>
                    <p class="card-text">Monitor and track all orders placed by users.</p>
                    <a href="/admin/orders" class="btn btn-light mt-auto">View Orders</a>
                </div>
            </div>
        </div>

        <!-- 👥 View Users (optional) -->
        <div class="col-md-4">
            <div class="card text-white bg-dark h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">View Users</h5>
                    <p class="card-text">Check registered users and their details.</p>
                    <a href="/admin/users" class="btn btn-light mt-auto">View Users</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
