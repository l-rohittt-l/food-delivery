	<!DOCTYPE html>
	<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title>All Orders - Admin Panel</title>
	    <meta name="viewport" content="width=device-width, initial-scale=1">
	    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet">
	    <link th:href="@{/css/styles.css}" rel="stylesheet">
	</head>
	<body>
	
	<!-- ✅ Navbar -->
	<nav class="navbar navbar-dark bg-dark mb-4">
	    <div class="container">
	        <a class="navbar-brand" href="/admin/dashboard">
	            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
	            Admin Panel
	        </a>
	        <a href="/logout" class="btn btn-outline-light">Logout</a>
	    </div>
	</nav>
	
	<!-- ✅ Page Content -->
	<div class="container">
	    <h2 class="mb-4">All Orders</h2>
	
	    <div th:if="${orders.empty}">
	        <p class="text-center text-muted">No orders have been placed yet.</p>
	    </div>
	
	    <div th:each="order : ${orders}" class="card shadow-sm mb-4 border-0 rounded-3">
	        <div class="card-header bg-primary text-white d-flex justify-content-between">
	            <div>
	                <strong>Order ID:</strong> <span th:text="${order.id}"></span> |
	                <strong>Placed On:</strong> <span th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy hh:mm a')}"></span>
	            </div>
	            <div><strong>Total: ₹<span th:text="${order.totalAmount}"></span></strong></div>
	        </div>
	        <div class="card-body">
	            <p><strong>Customer:</strong> <span th:text="${order.customerName}"></span></p>
	            <p><strong>Email:</strong> <span th:text="${order.customerEmail}"></span></p>
	            <p><strong>Address:</strong> <span th:text="${order.customerAddress}"></span></p>
	
	            <hr>
	            <h6 class="mb-3">Ordered Items:</h6>
	            <ul class="list-group">
	                <li th:each="item : ${order.orderItems}" class="list-group-item d-flex justify-content-between align-items-center">
	                    <div>
	                        <strong th:text="${item.food.name}"></strong>
	                        <div class="text-muted small">Qty: <span th:text="${item.quantity}"></span> @ ₹<span th:text="${item.food.price}"></span></div>
	                    </div>
	                    <div><strong>₹<span th:text="${item.food.price * item.quantity}"></span></strong></div>
	                </li>
	            </ul>
	        </div>
	    </div>
	</div>
	
	<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
	</body>
	</html>
