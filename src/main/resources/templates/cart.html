<!DOCTYPE html>
<html lang="en">
<head>
    <title>Your Cart - Food Delivery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Food Delivery
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
            </ul>

            <!-- ✅ Cart Icon -->
            <a href="/cart" class="btn btn-warning position-relative">
                <i class="bi bi-cart-fill"></i>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                      id="cartCount" style="display: none;">
                    0
                </span>
            </a>
        </div>
    </div>
</nav>

<!-- ✅ Cart Content -->
<div class="container mt-5">
    <h2 class="text-center mb-4">Your Cart</h2>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p class="text-center">Your cart is empty. Start adding some delicious food!</p>
    </div>

    <div th:if="${not #lists.isEmpty(cartItems)}">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- ✅ Loop through cart items -->
                <tr th:each="item : ${cartItems}">
                    <td>
                        <img th:src="${item.food.imageUrl}" alt="Food Image" width="80" height="60" class="rounded">
                    </td>
                    <td th:text="${item.food.name}"></td>
                    <td>
                        <span class="badge" th:classappend="${item.food.category == 'Vegetarian' ? 'bg-success' : 'bg-danger'}" 
                              th:text="${item.food.category}"></span>
                    </td>
                    <td th:text="'₹' + ${item.food.price}"></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <button class="btn btn-outline-secondary decrease-btn" th:data-id="${item.food.id}">−</button>
                            <input type="number" class="form-control text-center" th:value="${item.quantity}" min="1" th:data-id="${item.food.id}" style="width: 60px;" readonly>
                            <button class="btn btn-outline-secondary increase-btn" th:data-id="${item.food.id}">+</button>
                        </div>
                    </td>
                    <td th:text="'₹' + ${item.food.price * item.quantity}"></td>
                    <td>
                        <button class="btn btn-danger remove-btn" th:data-id="${item.food.id}">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- ✅ Total Price -->
        <div class="text-end">
            <h5>Total Price: ₹<span id="totalPrice" th:text="${totalPrice}">0</span></h5>
            <a href="/checkout" class="btn btn-primary mt-3">Proceed to Checkout</a>
        </div>
    </div>
</div>

<!-- ✅ Bootstrap JS -->
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
