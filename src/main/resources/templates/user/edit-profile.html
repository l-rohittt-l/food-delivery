<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>

    <!-- Bootstrap CSS for styling -->
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
</head>
<body>

<!-- Main container -->
<div class="container mt-5">

    <!-- Heading -->
    <h2 class="mb-4 text-center">Edit Your Profile</h2>

    <!-- ✅ Show error message if present -->
    <div class="alert alert-danger text-center" th:if="${error}" th:text="${error}"></div>

    <!-- Edit profile form -->
    <!-- th:action="@{/profile/edit}" → form sends data to /profile/edit -->
    <!-- th:object="${user}" → binds form fields to the user object -->
    <form th:action="@{/profile/edit}" th:object="${user}" method="post" class="row g-3">

        <!-- Full Name -->
        <div class="col-md-6">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" required>
        </div>

        <!-- Phone Number -->
        <div class="col-md-6">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="text" th:field="*{phone}" class="form-control" id="phone">
        </div>

        <!-- Address -->
        <div class="col-12">
            <label for="address" class="form-label">Address</label>
            <textarea th:field="*{address}" class="form-control" id="address" rows="3"></textarea>
        </div>

        <!-- Email (readonly) -->
        <div class="col-md-6">
            <label class="form-label">Email (cannot change)</label>
            <input type="email" th:value="${user.email}" class="form-control" readonly>
        </div>

        <!-- Submit and Cancel buttons -->
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Update Profile</button>
            <a th:href="@{/profile}" class="btn btn-secondary ms-2">Cancel</a>
        </div>

    </form>
</div>

</body>
</html>
