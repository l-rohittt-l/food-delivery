<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile - Foodies Express</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap & Icons -->
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css}">
    
    <!-- Custom Styles -->
    <style>
        body {
            background: linear-gradient(to bottom right, #fdfbfb, #ebedee);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: #0d6efd;
            color: white;
            font-size: 3rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .profile-info li {
            font-size: 1.1rem;
            padding: 12px 0;
        }

        .page-header {
            font-weight: bold;
            margin-bottom: 25px;
            color: #343a40;
        }

        .btn-edit {
            background-color: #0d6efd;
            color: white;
            border-radius: 50px;
            font-weight: 500;
            padding: 10px 25px;
        }

        .btn-edit:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Foodies Express
        </a>
        <a href="/logout" class="btn btn-outline-light">Logout</a>
    </div>
</nav>

<!-- ✅ Profile Section -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="profile-card">

                <div class="profile-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>

                <h3 class="page-header" th:text="${user.name}">John Doe</h3>
                <p class="text-muted mb-4" th:text="${user.email}">john@example.com</p>

                <ul class="list-group list-group-flush profile-info text-start">
                    <li class="list-group-item">
                        <strong><i class="bi bi-telephone-fill me-2"></i>Phone:</strong>
                        <span class="ms-2" th:text="${user.phone}">1234567890</span>
                    </li>
                    <li class="list-group-item">
                        <strong><i class="bi bi-geo-alt-fill me-2"></i>Address:</strong>
                        <span class="ms-2" th:text="${user.address}">123 Main Street</span>
                    </li>
                    <li class="list-group-item">
                        <strong><i class="bi bi-person-badge-fill me-2"></i>Role:</strong>
                        <span class="ms-2" th:text="${user.role}">USER</span>
                    </li>
                </ul>

                <a href="/profile/edit" class="btn btn-edit mt-4">
                    <i class="bi bi-pencil-square me-2"></i>Edit Profile
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ✅ Bootstrap JS -->
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
