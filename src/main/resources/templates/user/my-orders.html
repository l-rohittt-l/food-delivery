<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders - Foodies Express</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Foodies Express
        </a>
    </div>
</nav>

<!-- ✅ Main Content -->
<div class="container mt-5">
    <h2 class="text-center mb-4">My Orders</h2>

    <!-- No orders message -->
    <div th:if="${#lists.isEmpty(orders)}" class="text-center">
        <p>You haven't placed any orders yet.</p>
    </div>

    <!-- Accordion for orders -->
    <div th:if="${not #lists.isEmpty(orders)}" class="accordion" id="ordersAccordion">
		<div class="accordion-item mb-3" th:each="order, iStat : ${orders}">
            <h2 class="accordion-header" th:attr="id='heading-' + ${iStat.index}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        th:attr="data-bs-target='#collapse-' + ${iStat.index}, aria-controls='collapse-' + ${iStat.index}"
                        aria-expanded="false">
                    Order ID: <span th:text="${order.id}"></span> — 
                    Placed On: <span th:text="${#temporals.format(order.placedAt, 'dd MMM yyyy HH:mm')}"></span>
                </button>
            </h2>
            <div th:attr="id='collapse-' + ${iStat.index}" class="accordion-collapse collapse"
                 th:attrappend="aria-labelledby='heading-' + ${iStat.index}"
                 data-bs-parent="#ordersAccordion">
                <div class="accordion-body">
                    <p><strong>Total Amount:</strong> ₹<span th:text="${order.totalAmount}"></span></p>

                    <hr>
                    <h6>Items:</h6>
                    <ul class="list-group mb-3">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            th:each="item : ${order.orderItems}">
                            <div>
                                <strong th:text="${item.food.name}"></strong>
                                <small class="d-block text-muted">
                                    Quantity: <span th:text="${item.quantity}"></span><br>
                                    Price per item: ₹<span th:text="${item.food.price}"></span>
                                </small>
                            </div>
                            <span th:text="'₹' + ${item.quantity * item.food.price}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ✅ Bootstrap JS -->
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
