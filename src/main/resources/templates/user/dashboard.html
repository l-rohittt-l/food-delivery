<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Foodies Express</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- ✅ Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">
            <img th:src="@{/images/logo.png}" alt="Logo" style="height: 40px;" class="me-2">
            Foodies Express
        </a>
        <a href="/logout" class="btn btn-outline-light">Logout</a>
    </div>
</nav>

<!-- ✅ Dashboard Content -->
<div class="container mt-5">
    <h2 class="text-center mb-4">Welcome to Your Dashboard</h2>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title mb-3">What would you like to do?</h5>
                    <div class="d-grid gap-3">
                        <a href="/" class="btn btn-primary btn-lg">Browse Food Items</a>
                        <a href="/user/orders" class="btn btn-success btn-lg">View My Orders</a>
                        <a href="/cart" class="btn btn-warning btn-lg">Go to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
